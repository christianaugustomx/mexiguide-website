# ── Build: pre-render static city pages on every deploy ──
[build]
  command = "node build-cities.js"
  publish = "."

# Old JS-driven URLs → new clean static URLs (301, SEO-safe)
[[redirects]]
  from = "/destinations.html"
  to = "/destinations/"
  status = 301
  force = true

[[redirects]]
  from = "/city.html"
  to = "/destinations/"
  status = 301
  force = true

[[redirects]]
  from = "/es/city.html"
  to = "/es/destinos/"
  status = 301
  force = true

[[redirects]]
  from = "/pt/city.html"
  to = "/pt/destinos/"
  status = 301
  force = true

[[redirects]]
  from = "/es/destinations.html"
  to = "/es/destinos/"
  status = 301
  force = true

[[redirects]]
  from = "/pt/destinations.html"
  to = "/pt/destinos/"
  status = 301
  force = true

# Pretty URLs serve their index.html
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# ── Cache: HTML revalidates fast, assets cached aggressively ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=3600, must-revalidate"

[[headers]]
  for = "/destinations/*"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=3600, must-revalidate"

[[headers]]
  for = "/es/destinos/*"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=3600, must-revalidate"

[[headers]]
  for = "/pt/destinos/*"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=3600, must-revalidate"

[[headers]]
  for = "/fr/destinations/*"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=3600, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
